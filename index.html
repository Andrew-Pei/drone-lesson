<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>动手造一台无人机 · 初一科技课</title>
<style>
:root{
  --bg:#080e1c; --panel:#0e182c; --panel2:#142239; --line:#263a60;
  --text:#e9f1ff; --muted:#94a8cc; --cyan:#37e2d5; --orange:#ff9f43;
  --blue:#5b9dff; --green:#7ee787; --red:#ff6b7a; --gold:#ffd166;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:flex;height:100vh}
/* ---------- sidebar ---------- */
.side{width:264px;flex:0 0 264px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand h1{font-size:19px;letter-spacing:.5px}
.brand p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.brand .tag{display:inline-block;margin-top:10px;font-size:11px;color:var(--cyan);
  border:1px solid rgba(55,226,213,.35);border-radius:20px;padding:3px 10px}
.steps{flex:1;overflow-y:auto;padding:14px 10px 20px}
.steps::-webkit-scrollbar{width:6px}
.steps::-webkit-scrollbar-thumb{background:#2b4068;border-radius:4px}
.step{display:flex;gap:11px;align-items:flex-start;padding:10px 10px;border-radius:9px;
  cursor:pointer;font-size:13px;color:var(--muted);line-height:1.45;transition:.16s}
.step:hover{background:var(--panel2);color:var(--text)}
.step.on{background:linear-gradient(90deg,rgba(91,157,255,.20),rgba(91,157,255,.04));
  color:var(--text);box-shadow:inset 2px 0 0 var(--blue)}
.num{flex:0 0 24px;height:24px;border-radius:7px;background:#1c2c49;color:var(--muted);
  font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.step.on .num{background:var(--blue);color:#06122b}
.step.done .num{background:rgba(126,231,135,.18);color:var(--green)}
.foot{padding:12px 18px;border-top:1px solid var(--line);font-size:11px;color:#6077a0;line-height:1.7}
/* ---------- stage ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{padding:18px 30px 14px;border-bottom:1px solid var(--line);display:flex;
  align-items:flex-end;justify-content:space-between;gap:16px}
.kicker{font-size:12px;color:var(--cyan);letter-spacing:2px;margin-bottom:6px}
.top h2{font-size:27px;font-weight:700;letter-spacing:.5px}
.top .hint{font-size:12px;color:var(--muted);text-align:right;line-height:1.7}
.body{flex:1;overflow-y:auto;padding:22px 30px 26px;display:grid;
  grid-template-columns:minmax(300px,390px) minmax(420px,1fr);gap:22px;align-content:start}
@media(max-width:1100px){.body{grid-template-columns:1fr}.side{width:210px;flex-basis:210px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{font-size:15px;color:var(--blue);margin-bottom:12px;letter-spacing:.5px}
.lead{font-size:15px;line-height:1.9;color:var(--text);margin-bottom:12px}
.note{font-size:13px;line-height:1.85;color:var(--muted);background:var(--panel2);
  border-left:3px solid var(--line);border-radius:0 8px 8px 0;padding:11px 13px;margin:12px 0}
.note.q{border-left-color:var(--gold);color:#d9e3f7}
.note.ok{border-left-color:var(--green)}
.note.warn{border-left-color:var(--red)}
.note b{color:var(--text)}
.formula{font-family:Consolas,"Courier New",monospace;font-size:14px;color:var(--cyan);
  background:#081426;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  margin:10px 0;line-height:1.9}
/* controls */
.row{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;padding:9px 15px;
  background:var(--panel2);color:var(--text);border:1px solid var(--line);transition:.15s}
button:hover{border-color:var(--blue);background:#1b2d4d}
button.primary{background:var(--blue);color:#06122b;border-color:var(--blue);font-weight:700}
button.primary:hover{background:#7db2ff}
button.ghost{background:transparent}
button.sel{border-color:var(--cyan);background:rgba(55,226,213,.12);color:var(--cyan)}
button:disabled{opacity:.4;cursor:not-allowed}
.fb{margin-top:12px;font-size:13px;line-height:1.75;min-height:22px;color:var(--muted)}
.fb.good{color:var(--green)} .fb.bad{color:var(--red)}
/* blade cards */
.blades{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.blade{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;
  cursor:pointer;text-align:center;transition:.15s}
.blade:hover{border-color:var(--blue)}
.blade svg{width:100%;height:62px;display:block}
.blade span{font-size:12px;color:var(--muted)}
.blade.pick{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.blade.pick span{color:var(--cyan)}
.blade.no{border-color:var(--red)}
.blade.yes{border-color:var(--green)}
/* checkbox list */
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;font-size:14px;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt input{accent-color:var(--cyan);width:16px;height:16px}
/* slider */
.sl{width:100%;accent-color:var(--cyan);margin:8px 0 4px}
.slrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.readout{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.ro{background:#081426;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.ro small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.ro b{font-size:17px;color:var(--cyan);font-family:Consolas,monospace}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.bar{text-align:center;font-size:11px;color:var(--muted)}
.bar .track{height:52px;background:#081426;border:1px solid var(--line);border-radius:6px;
  position:relative;overflow:hidden;margin-bottom:5px}
.bar .fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--cyan),#1b8f96);height:50%}
.bar .fill.o{background:linear-gradient(180deg,var(--orange),#a55d20)}
/* canvas */
.vizwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;position:sticky;top:0}
.vizwrap .vhead{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--muted);margin-bottom:10px}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#1b2d4d;color:var(--muted)}
.badge.live{background:rgba(126,231,135,.14);color:var(--green)}
canvas{width:100%;aspect-ratio:760/480;display:block;border-radius:9px;background:#0d1628;cursor:default}
canvas.clickable{cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;padding:13px 30px;
  border-top:1px solid var(--line);background:var(--panel)}
.nav .prog{font-size:12px;color:var(--muted)}
.nav .prog b{color:var(--cyan)}
.navbtns{display:flex;gap:9px}
/* summary */
.sumlist{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0}
.sumitem{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px}
.sumitem b{display:block;font-size:13px;color:var(--cyan);margin-bottom:4px}
.sumitem span{font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>动手造一台无人机</h1>
      <p>初一科技课 · 从一次次失败里<br>把零件「逼」出来</p>
      <span class="tag">12 站 · 约 40 分钟</span>
    </div>
    <div class="steps" id="steps"></div>
    <div class="foot">← / → 翻页<br>灰色区域可点击操作</div>
  </aside>

  <main class="main">
    <div class="top">
      <div><div class="kicker" id="kicker"></div><h2 id="title"></h2></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="body">
      <div>
        <div class="card" id="content"></div>
      </div>
      <div class="vizwrap">
        <div class="vhead"><span>演示台 · 俯视 / 侧视示意</span><span class="badge" id="badge">示意动画</span></div>
        <canvas id="cv"></canvas>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div class="nav">
      <div class="prog">第 <b id="pn">1</b> / 12 站</div>
      <div class="navbtns">
        <button class="ghost" id="prev">← 上一站</button>
        <button class="primary" id="next">下一站 →</button>
      </div>
    </div>
  </main>
</div>

<script>
/* ========================= 基础 ========================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=760,H=480, dpr=window.devicePixelRatio||1;
cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
const C={bg:'#0d1628',text:'#e9f1ff',muted:'#94a8cc',cyan:'#37e2d5',orange:'#ff9f43',
  blue:'#5b9dff',green:'#7ee787',red:'#ff6b7a',gold:'#ffd166',line:'#263a60'};
const F='"PingFang SC","Microsoft YaHei",sans-serif';
function bg(){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(91,157,255,.06)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}}
function T(s,x,y,sz,col,align,weight){ctx.font=(weight||'400')+' '+sz+'px '+F;
  ctx.fillStyle=col||C.text;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function rr(x,y,w,h,r,fill,stroke,lw){ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
  if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}
function arrow(x1,y1,x2,y2,col,lw){ctx.strokeStyle=col;ctx.lineWidth=lw||2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-9*Math.cos(a-.45),y2-9*Math.sin(a-.45));
  ctx.lineTo(x2-9*Math.cos(a+.45),y2-9*Math.sin(a+.45));ctx.closePath();ctx.fillStyle=col;ctx.fill();}
function label(s,x,y,col){T(s,x,y,13,col||C.muted);}
const ARM=[[-1,-1],[1,-1],[1,1],[-1,1]];
/* 俯视四旋翼 */
function droneTop(cx,cy,sc,o){
  o=o||{};const d=sc*.62,pr=sc*.30;
  const dirs=o.dirs||[1,1,1,1],th=o.thr||[.6,.6,.6,.6];
  ctx.save();ctx.translate(cx,cy);ctx.rotate(o.yaw||0);
  ctx.strokeStyle='#33507f';ctx.lineWidth=sc*.085;ctx.lineCap='round';
  ARM.forEach(p=>{ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(p[0]*d,p[1]*d);ctx.stroke();});
  rr(-sc*.20,-sc*.20,sc*.40,sc*.40,sc*.07,'#1b2c4a',C.blue,2);
  ctx.fillStyle=C.gold;ctx.beginPath();ctx.arc(0,-sc*.27,sc*.045,0,7);ctx.fill();
  T('前',0,-sc*.36,11,C.gold,'center');
  ARM.forEach((p,i)=>{
    const x=p[0]*d,y=p[1]*d;
    ctx.save();ctx.translate(x,y);
    /* 转速光晕 */
    const col=dirs[i]>0?C.cyan:C.orange;
    ctx.fillStyle=col;ctx.globalAlpha=.07+th[i]*.14;
    ctx.beginPath();ctx.arc(0,0,pr*1.15,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,pr,0,7);ctx.stroke();
    ctx.save();ctx.rotate((o.t||0)*(3+th[i]*13)*dirs[i]+i*.8);
    ctx.fillStyle=col;
    for(let k=0;k<2;k++){ctx.save();ctx.rotate(k*Math.PI);
      ctx.beginPath();ctx.ellipse(pr*.55,0,pr*.55,pr*.13,0,0,7);ctx.fill();ctx.restore();}
    ctx.restore();
    /* 转向弧箭头 */
    ctx.strokeStyle=col;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,pr*1.30,dirs[i]>0?-.9:.9,dirs[i]>0?.9:2.3);ctx.stroke();
    ctx.restore();
    if(o.tags) T((i+1)+'',x,y+5,12,'#0a1428','center','700');
  });
  ctx.restore();
}
/* 侧视飞机 */
function plane(x,y,tilt,thr){
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt||0);
  ctx.strokeStyle='#33507f';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-70,0);ctx.lineTo(70,0);ctx.stroke();
  rr(-24,-13,48,26,6,'#1b2c4a',C.blue,2);
  [-70,70].forEach(px=>{
    ctx.save();ctx.translate(px,-8);ctx.rotate((performance.now()/1000)*(6+thr*16));
    ctx.fillStyle=C.cyan;
    for(let k=0;k<2;k++){ctx.save();ctx.rotate(k*Math.PI);
      ctx.beginPath();ctx.ellipse(20,0,20,3.5,0,0,7);ctx.fill();ctx.restore();}
    ctx.restore();
    ctx.strokeStyle='#33507f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,-8);ctx.stroke();
  });
  ctx.strokeStyle='#33507f';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-20,13);ctx.lineTo(-30,26);ctx.moveTo(20,13);ctx.lineTo(30,26);ctx.stroke();
  /* 升力箭头 */
  const L=14+thr*30;arrow(0,-14,0,-14-L,C.cyan,2);
  ctx.restore();
}
function sideView(o){
  const gy=H-72,ppm=58;bg();
  ctx.fillStyle='#16233c';ctx.fillRect(0,gy,W,H-gy);
  ctx.strokeStyle='#3a5c8f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
  for(let i=0;i<10;i++){ctx.strokeStyle='rgba(58,92,143,.4)';
    ctx.beginPath();ctx.moveTo(i*80+10,gy);ctx.lineTo(i*80-10,H);ctx.stroke();}
  if(o.target!=null){const ty=gy-o.target*ppm;
    ctx.strokeStyle=C.green;ctx.setLineDash([9,7]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(50,ty);ctx.lineTo(W-50,ty);ctx.stroke();ctx.setLineDash([]);
    T('目标 '+o.target.toFixed(1)+' m',W-56,ty-9,14,C.green,'right');}
  if(o.wind){ctx.strokeStyle=C.red;ctx.lineWidth=2;
    for(let i=0;i<3;i++){const wy=180+i*70;
      arrow(20+(i%2)*30,wy,150+(i%2)*30,wy,C.red,2);}
    T('阵风 →',26,150,13,C.red);}
  const py=gy-Math.max(0,o.alt||0)*ppm;
  plane(W/2,Math.max(-120,Math.min(gy-20,py)),o.tilt||0,o.thr||0);
  const h=Math.max(0,o.alt||0);
  T('当前高度  '+h.toFixed(2)+' m',24,36,18,C.text,'left','700');
  T('电机转速  '+Math.round((o.thr||0)*100)+'%',24,62,14,C.cyan);
  /* 转速条 */
  rr(W-190,26,164,14,7,'#081426',C.line,1);
  rr(W-189,27,162*Math.max(0,Math.min(1,o.thr||0)),12,6,C.cyan);
  if(o.msg)T(o.msg,W/2,H-20,15,C.gold,'center','700');
}
/* ========================= 状态 ========================= */
let cur=0,S={};
const $=id=>document.getElementById(id);
function fb(s,cls){const e=$('fb');if(e){e.textContent=s;e.className='fb'+(cls?' '+cls:'');}}
function badge(s,live){const e=$('badge');e.textContent=s;e.className='badge'+(live?' live':'');}
function legend(items){$('legend').innerHTML=items.map(i=>'<span><i class="dot" style="background:'+i[1]+'"></i>'+i[0]+'</span>').join('');}
function bars(vals,dirs){
  const e=$('bars');if(!e)return;
  e.innerHTML=vals.map((v,i)=>'<div class="bar"><div class="track"><div class="fill'+
    ((dirs&&dirs[i]<0)?' o':'')+'" style="height:'+Math.round(v*100)+'%"></div></div>'+
    '桨'+(i+1)+' '+Math.round(v*100)+'%</div>').join('');
}
/* ========================= 12 站 ========================= */
const steps=[
/* 0 */{
 k:'第 1 站 · 开工',t:'动手造一台',hint:'目标：让它稳稳悬停在教室半空',
 html:()=>`<h3>今天不背书，我们自己造</h3>
 <p class="lead">给你一堆零件，装起来，通电，看它能不能飞。</p>
 <div class="sumlist">
  <div class="sumitem"><b>螺旋桨</b><span>把空气往下推，换来向上的力</span></div>
  <div class="sumitem"><b>电机</b><span>让桨转起来，转多快由我们说了算</span></div>
  <div class="sumitem"><b>机架</b><span>把四个电机固定成一个整体</span></div>
  <div class="sumitem"><b>控制系统</b><span>飞机的「脑子」，今天的主角</span></div>
 </div>
 <div class="note q">先别急着画图纸 —— 这四个部件里，有一个现在还不知道该长什么样。我们一边试、一边把它补上。</div>
 <div class="row"><button class="primary" data-act="go" data-to="1">先造螺旋桨 →</button></div>
 <div class="fb" id="fb"></div>`,
 legend:()=>legend([['机架',C.blue],['螺旋桨',C.cyan],['机头方向',C.gold]]),
 reset:()=>{},
 draw:(dt,t)=>{bg();droneTop(W/2,H/2,150,{t,dirs:[1,-1,1,-1],thr:[.55,.55,.55,.55],tags:false});
   T('俯视图 · 四个桨 + 机架',W/2,44,17,C.text,'center','700');
   /* 部件标注 */
   const parts=[[120,120,'螺旋桨'],[560,120,'电机'],[120,360,'机架'],[560,360,'控制系统 ?']];
   parts.forEach((p,i)=>{rr(p[0]-8,p[1]-24,150,32,8,'#142239',C.line,1);
     T(p[2],p[0]+67,p[1]-3,13,i===3?C.gold:C.muted,'center');});
   T('中间那块「脑子」该怎么工作？往下看',W/2,H-24,14,C.gold,'center');}
},
/* 1 */{
 k:'第 2 站 · 零件',t:'叶片形状：只有一种是对的',hint:'让学生先选，选错比选对更有价值',
 html:()=>`<h3>第一道选择题</h3>
 <p class="lead">四片叶子，形状都不一样。旋转起来，<b>只有一片</b>能把空气往下推、把飞机抬起来。</p>
 <div class="blades" id="blades">
  <div class="blade" data-act="blade" data-i="0"><svg viewBox="0 0 120 62">
    <rect x="12" y="27" width="96" height="9" rx="2" fill="#8fa3c8"/>
    <path d="M12 27h96" stroke="#c8d6f0" stroke-width="1"/></svg><span>A 平板条</span></div>
  <div class="blade" data-act="blade" data-i="1"><svg viewBox="0 0 120 62">
    <path d="M12 31 Q60 12 108 31 Q60 50 12 31Z" fill="#8fa3c8"/></svg><span>B 对称梭形</span></div>
  <div class="blade" data-act="blade" data-i="2"><svg viewBox="0 0 120 62">
    <path d="M14 38 Q55 14 106 22 Q70 40 14 38Z" fill="#37e2d5"/></svg><span>C 上凸下平 · 带斜角</span></div>
  <div class="blade" data-act="blade" data-i="3"><svg viewBox="0 0 120 62">
    <path d="M14 24 Q55 48 106 40 Q70 22 14 24Z" fill="#ff9f43"/></svg><span>D 上下装反</span></div>
 </div>
 <div class="note">提示：桨叶不是「扇风」，是斜着切进空气。想想把手伸出车窗，手掌一斜，风就把手往上托。</div>
 <div class="fb" id="fb">点一片试试。</div>`,
 legend:()=>legend([['气流',C.blue],['向下的推力',C.cyan],['升力',C.green]]),
 reset:()=>{S.pick=-1;},
 draw:(dt,t)=>{bg();

 reset:()=>{S.dirs=[1,1,1,1];S.yaw=0;},
 click:(x,y)=>{
   const d=155*.62, cx=W/2,cy=H/2;
   let best=-1,bd=1e9;
   ARM.forEach((p,i)=>{const dx=x-(cx+p[0]*d),dy=y-(cy+p[1]*d),dd=dx*dx+dy*dy;
     if(dd<bd){bd=dd;best=i;}});
   if(bd<(155*.34)**2){S.dirs[best]*=-1;
     const q=$('fb');if(q){q.textContent='切换了桨 '+(best+1)+' 的转向。';q.className='fb';}}
 },

   T('点桨叶切换转向',W/2,38,16,C.text,'center','700');

 </div>
 <div class="bars" id="bars"></div>
 <div class="note"><b>规律：</b>四个桨转速<b>一样</b> → 悬停；<b>有差别</b> → 倾斜、平移；<b>一对对角桨一起变快</b> → 机身自己转。</div>
 <div class="fb" id="fb">试试各个按钮。</div>`,
 legend:()=>legend([['正桨',C.cyan],['反桨',C.orange],['运动方向',C.gold]]),
 reset:()=>{S.cmd='h';S.bars=[.5,.5,.5,.5];S.yaw=0;S.dx=0;S.dy=0;},
 tick:(dt)=>{
   const M={h:[.5,.5,.5,.5],f:[.38,.38,.68,.68],b:[.68,.68,.38,.38],
     l:[.68,.38,.38,.68],r:[.38,.68,.68,.38],cw:[.68,.38,.68,.38],ccw:[.38,.68,.38,.68]};
   S.bars=M[S.cmd]||M.h;bars(S.bars,[1,-1,1,-1]);
   if(S.cmd==='cw'||S.cmd==='ccw')S.yaw+=(S.cmd==='cw'?1:-1)*.9*dt;
   if(S.cmd==='f')S.dy-=32*dt;if(S.cmd==='b')S.dy+=32*dt;
   if(S.cmd==='l')S.dx-=32*dt;if(S.cmd==='r')S.dx+=32*dt;
   S.dx=Math.max(-110,Math.min(110,S.dx));S.dy=Math.max(-80,Math.min(80,S.dy));
   const net=S.cmd==='cw'?1:(S.cmd==='ccw'?-1:0);
   const e=$('netv');if(e)e.textContent=net>0?'+1':(net<0?'-1':'0');
 },
 draw:(dt,t)=>{bg();
   T('俯视 · 指令：'+$('cmdv').textContent,W/2,38,17,C.text,'center','700');
   ctx.save();ctx.translate(S.dx,S.dy);
   droneTop(W/2,H/2,135,{t,yaw:S.yaw,dirs:[1,-1,1,-1],thr:S.bars});
   ctx.restore();
   const dirs={f:[0,-1,'前进'],b:[0,1,'后退'],l:[-1,0,'左移'],r:[1,0,'右移']};
   if(dirs[S.cmd]){const d=dirs[S.cmd];
     arrow(W/2+d[0]*120,H/2+d[1]*100,W/2+d[0]*210,H/2+d[1]*175,C.gold,3);
     T(d[2],W/2+d[0]*220,H/2+d[1]*185+5,15,C.gold,'center','700');}
   if(S.cmd==='cw'||S.cmd==='ccw'){
     ctx.strokeStyle=C.gold;ctx.lineWidth=3;ctx.setLineDash([7,6]);
     ctx.beginPath();ctx.arc(W/2,H/2,180,-1,1.4);ctx.stroke();ctx.setLineDash([]);
     T('自转',W/2,H-28,16,C.gold,'center','700');}
   T('四个桨的转速差 = 全部动作的来源',W/2,H-28,14,C.muted,'center');
 }
},

 k:'第 12 站 · 收尾',t:'总结：一台无人机到底需要什么',hint:'把整节课串成一个闭环',

 <div class="sumlist">

 <div class="note q">课后想一想：规则太死，飞机会在目标高度上下晃。你会怎么改，让它停得更稳？</div>

 legend:()=>legend([['感知',C.gold],['判断',C.blue],['执行',C.cyan]]),
 reset:()=>{},
 draw:(dt,t)=>{bg();

   arrow(285,160,470,160,C.gold,2);
   arrow(540,225,430,325,C.blue,2);
   arrow(300,325,205,225,C.cyan,2);
   T('测量值',378,145,12,C.gold,'center');
   T('控制指令',520,290,12,C.blue,'center');
   T('飞机状态改变',225,290,12,C.cyan,'center');
   T('每秒循环几百上千次',W/2,H-24,15,C.green,'center','700');
 }
}
];

/* ========================= 渲染与交互 ========================= */
function buildSidebar(){
  $('steps').innerHTML=steps.map((s,i)=>'<div class="step'+(i===0?' on':'')+'" data-i="'+i+'">'+
    '<span class="num">'+(i+1)+'</span><span>'+s.t+'</span></div>').join('');
}
function go(i){
  cur=Math.max(0,Math.min(steps.length-1,i));
  const s=steps[cur];
  $('kicker').textContent=s.k; $('title').textContent=s.t; $('hint').textContent=s.hint||'';
  $('pn').textContent=cur+1;
  $('content').innerHTML=s.html();
  S={}; if(s.reset)s.reset();
  if(s.legend)s.legend();else legend([]);
  badge(cur===11?'课堂总结':'示意动画',false);
  cv.className=(cur===3?'clickable':'');
  document.querySelectorAll('.step').forEach((e,j)=>{
    e.className='step'+(j===cur?' on':'')+(j<cur?' done':'');});
  $('prev').disabled=(cur===0);
  $('next').textContent=(cur===steps.length-1?'回到开头 ↺':'下一站 →');
  if(s.tick)bars([.5,.5,.5,.5],[1,-1,1,-1]);
}
/* 按钮 / 选项统一分发 */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act, v=el.dataset;
  switch(a){
   case 'go': go(+v.to); break;
   case 'blade': {
     S.pick=+v.i;
     document.querySelectorAll('.blade').forEach((b,j)=>{b.className='blade'+(j===S.pick?' pick':'');});
     const msgs=[
      ['上下一样平，切空气时不产生向上的力。再想想。','bad'],
      ['上下对称、没有斜角，空气顺着两边滑过去，托不起来。','bad'],
      ['对！上凸下平 + 斜着切进空气 = 升力。而且还得再做一片镜像的（正桨 / 反桨），记住这一点。','good'],
      ['迎角反了，空气被往上推，飞机被往下按。装反了。','bad']];
     fb(msgs[S.pick][0],msgs[S.pick][1]);
     const card=document.querySelectorAll('.blade')[S.pick];
     card.className='blade pick '+(S.pick===2?'yes':'no');
     break;}
   case 'fly': S.fly=true;S.spinV=0;fb('飞机起来了……等等，机身怎么在转？','bad');break;
   case 'stopfly': S.fly=false;S.spinV=0;S.yaw=0;S.spin=0;fb('断电，重新来。');break;
   case 'alldir': S.dirs=[1,1,1,1];S.yaw=0;fb('又全同向了，机身开始打转。');break;
   case 'fly2': S.fly=true;S.alt=0;fb('一直上升，停不下来。','bad');break;
   case 'stop2': S.fly=false;S.alt=0;fb('');break;
   case 'checkopts': {
     const got=[...document.querySelectorAll('[data-opt]:checked')].map(x=>x.dataset.opt);
     if(got.length===1&&got[0]==='h'){fb('对！只要知道「我现在几米」，就能跟 3 米比。','good');
       $('sensor').style.display='block';}
     else if(got.includes('h')&&got.includes('a')){fb('高度对了，姿态也确实需要 —— 但那是下一站才被迫加上的。这一站先只留「高度」。','bad');}
     else fb('再想想：跟「3 米」直接比较的是哪一个量？','bad');
     break;}
   case 'resetctrl': S.alt=0;S.v=0;fb('回到地面，重新爬升。');break;
   case 'windon': go(7);break;
   case 'gust': S.gust=true;fb('风来了 —— 高度传感器还在正常工作，可飞机还是翻了。','bad');break;
   case 'resetgust': S.alt=3;S.tilt=0;S.gust=false;S.fall=false;fb('重新悬停。');break;
   case 'zeropose': S.r=0;S.p=0;S.y=0;
     ['rsl','psl','ysl'].forEach(id=>$(id).value=0);
     $('rv').textContent='0°';$('pv').textContent='0°';$('yv').textContent='0°';break;
   case 'push': S.roll=0.42;fb('机身向右歪了，看四个桨怎么反应。');break;
   case 'pushL': S.roll=-0.42;fb('机身向左歪了，看四个桨怎么反应。');break;
   case 'level': S.roll=0;fb('恢复水平。');break;
   case 'cmd': {
     S.cmd=v.c;
     const names={h:'悬停',f:'前进',b:'后退',l:'左移',r:'右移',cw:'顺时针自转',ccw:'逆时针自转'};
     $('cmdv').textContent=names[v.c];
     document.querySelectorAll('[data-act="cmd"]').forEach(b=>b.classList.toggle('sel',b.dataset.c===v.c));
     fb(v.c==='h'?'四个桨转速相同 → 悬停。':v.c==='cw'||v.c==='ccw'?
       '一对对角桨变快、另一对变慢 → 反扭矩不再抵消 → 机身自转。':
       '前后（或左右）两对桨转速不同 → 机身倾斜 → 升力有了水平分量。','good');
     break;}
  }
});
/* 滑块 */
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='tgt'){S.target=+e.target.value;$('tgtv').textContent=S.target.toFixed(1)+' m';}
  if(id==='rsl'){S.r=+e.target.value;$('rv').textContent=S.r+'°';}
  if(id==='psl'){S.p=+e.target.value;$('pv').textContent=S.p+'°';}
  if(id==='ysl'){S.y=+e.target.value;$('yv').textContent=S.y+'°';}
});
/* canvas 点击 */
cv.addEventListener('click',e=>{
  const s=steps[cur];if(!s.click)return;
  const r=cv.getBoundingClientRect();
  s.click((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);
});
/* 导航 */
$('steps').addEventListener('click',e=>{const d=e.target.closest('[data-i]');if(d)go(+d.dataset.i);});
$('prev').addEventListener('click',()=>go(cur-1));
$('next').addEventListener('click',()=>go(cur===steps.length-1?0:cur+1));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')go(cur===steps.length-1?0:cur+1);
  if(e.key==='ArrowLeft')go(cur-1);
});
/* 动画主循环 */
let last=performance.now(),tt=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;
  const s=steps[cur];
  if(s.tick)s.tick(dt,tt);
  if(s.draw)s.draw(dt,tt);
  requestAnimationFrame(loop);
}
buildSidebar();go(0);requestAnimationFrame(loop);
</script>
</body>
</html>
